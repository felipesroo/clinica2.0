
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a6762" />
      <stop offset="50%" stop-color="#6c5a56" />
      <stop offset="100%" stop-color="#53433f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="50%" stop-color="#fed65b" />
      <stop offset="100%" stop-color="#e9c349" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5ddd7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.96" stdDeviation="1.28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14.08" fill="url(#bgGrad)" />

  <!-- Outer subtle luxury border -->
  <rect x="1.28" y="1.28" width="61.44" height="61.44" rx="12.8" fill="none" stroke="url(#goldGrad)" stroke-width="0.64" stroke-opacity="0.4" />

  <!-- Emblem Group -->
  <g filter="url(#shadow)">
    <!-- Central Luxury Flower / Esthetic Sparkle Motif -->
    <circle cx="32" cy="26.88" r="11.52" fill="none" stroke="url(#goldGrad)" stroke-width="1.152" stroke-dasharray="1.92 0.96"/>
    
    <!-- Monogram JF / Dra. Jordane -->
    <text 
      x="32" 
      y="30.72" 
      font-family="Playfair Display, Georgia, serif" 
      font-size="14.08" 
      font-weight="bold" 
      fill="url(#accentGrad)" 
      text-anchor="middle" 
      dominant-baseline="middle"
      letter-spacing="-0.02em"
    >JF</text>

    <!-- Small Golden Star Sparkle on top right of monogram -->
    <path 
      d="M 39.68 17.92 Q 39.68 20.48 42.24 20.48 Q 39.68 20.48 39.68 23.04 Q 39.68 20.48 37.12 20.48 Q 39.68 20.48 39.68 17.92 Z" 
      fill="url(#goldGrad)"
    />

    <!-- Subtitle Text "DRA. JORDANE" -->
    <text 
      x="32" 
      y="43.52" 
      font-family="Inter, -apple-system, sans-serif" 
      font-size="4.16" 
      font-weight="700" 
      fill="url(#goldGrad)" 
      text-anchor="middle" 
      letter-spacing="0.16em"
    >DRA. JORDANE</text>

    <!-- Subtitle Category "ESTÉTICA AVANÇADA" -->
    <text 
      x="32" 
      y="49.28" 
      font-family="Inter, -apple-system, sans-serif" 
      font-size="2.56" 
      font-weight="500" 
      fill="#f5ddd7" 
      text-anchor="middle" 
      letter-spacing="0.22em"
      opacity="0.9"
    >ESTÉTICA AVANÇADA</text>
  </g>
</svg>
