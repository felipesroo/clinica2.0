
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a6762" />
      <stop offset="50%" stop-color="#6c5a56" />
      <stop offset="100%" stop-color="#53433f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="50%" stop-color="#fed65b" />
      <stop offset="100%" stop-color="#e9c349" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5ddd7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.88" stdDeviation="3.84" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="192" height="192" rx="42.24" fill="url(#bgGrad)" />

  <!-- Outer subtle luxury border -->
  <rect x="3.84" y="3.84" width="184.32" height="184.32" rx="38.400000000000006" fill="none" stroke="url(#goldGrad)" stroke-width="1.92" stroke-opacity="0.4" />

  <!-- Emblem Group -->
  <g filter="url(#shadow)">
    <!-- Central Luxury Flower / Esthetic Sparkle Motif -->
    <circle cx="96" cy="80.64" r="34.56" fill="none" stroke="url(#goldGrad)" stroke-width="3.4559999999999995" stroke-dasharray="5.76 2.88"/>
    
    <!-- Monogram JF / Dra. Jordane -->
    <text 
      x="96" 
      y="92.16" 
      font-family="Playfair Display, Georgia, serif" 
      font-size="42.24" 
      font-weight="bold" 
      fill="url(#accentGrad)" 
      text-anchor="middle" 
      dominant-baseline="middle"
      letter-spacing="-0.02em"
    >JF</text>

    <!-- Small Golden Star Sparkle on top right of monogram -->
    <path 
      d="M 119.03999999999999 53.760000000000005 Q 119.03999999999999 61.44 126.72 61.44 Q 119.03999999999999 61.44 119.03999999999999 69.12 Q 119.03999999999999 61.44 111.35999999999999 61.44 Q 119.03999999999999 61.44 119.03999999999999 53.760000000000005 Z" 
      fill="url(#goldGrad)"
    />

    <!-- Subtitle Text "DRA. JORDANE" -->
    <text 
      x="96" 
      y="130.56" 
      font-family="Inter, -apple-system, sans-serif" 
      font-size="12.48" 
      font-weight="700" 
      fill="url(#goldGrad)" 
      text-anchor="middle" 
      letter-spacing="0.16em"
    >DRA. JORDANE</text>

    <!-- Subtitle Category "ESTÉTICA AVANÇADA" -->
    <text 
      x="96" 
      y="147.84" 
      font-family="Inter, -apple-system, sans-serif" 
      font-size="7.68" 
      font-weight="500" 
      fill="#f5ddd7" 
      text-anchor="middle" 
      letter-spacing="0.22em"
      opacity="0.9"
    >ESTÉTICA AVANÇADA</text>
  </g>
</svg>
