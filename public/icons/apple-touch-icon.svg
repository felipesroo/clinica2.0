
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a6762" />
      <stop offset="50%" stop-color="#6c5a56" />
      <stop offset="100%" stop-color="#53433f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="50%" stop-color="#fed65b" />
      <stop offset="100%" stop-color="#e9c349" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5ddd7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.6999999999999997" stdDeviation="3.6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="180" height="180" rx="39.6" fill="url(#bgGrad)" />

  <!-- Outer subtle luxury border -->
  <rect x="3.6" y="3.6" width="172.79999999999998" height="172.79999999999998" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-opacity="0.4" />

  <!-- Emblem Group -->
  <g filter="url(#shadow)">
    <!-- Central Luxury Flower / Esthetic Sparkle Motif -->
    <circle cx="90" cy="75.6" r="32.4" fill="none" stroke="url(#goldGrad)" stroke-width="3.2399999999999998" stroke-dasharray="5.3999999999999995 2.6999999999999997"/>
    
    <!-- Monogram JF / Dra. Jordane -->
    <text 
      x="90" 
      y="86.39999999999999" 
      font-family="Playfair Display, Georgia, serif" 
      font-size="39.6" 
      font-weight="bold" 
      fill="url(#accentGrad)" 
      text-anchor="middle" 
      dominant-baseline="middle"
      letter-spacing="-0.02em"
    >JF</text>

    <!-- Small Golden Star Sparkle on top right of monogram -->
    <path 
      d="M 111.6 50.400000000000006 Q 111.6 57.6 118.80000000000001 57.6 Q 111.6 57.6 111.6 64.8 Q 111.6 57.6 104.39999999999999 57.6 Q 111.6 57.6 111.6 50.400000000000006 Z" 
      fill="url(#goldGrad)"
    />

    <!-- Subtitle Text "DRA. JORDANE" -->
    <text 
      x="90" 
      y="122.4" 
      font-family="Inter, -apple-system, sans-serif" 
      font-size="11.700000000000001" 
      font-weight="700" 
      fill="url(#goldGrad)" 
      text-anchor="middle" 
      letter-spacing="0.16em"
    >DRA. JORDANE</text>

    <!-- Subtitle Category "ESTÉTICA AVANÇADA" -->
    <text 
      x="90" 
      y="138.6" 
      font-family="Inter, -apple-system, sans-serif" 
      font-size="7.2" 
      font-weight="500" 
      fill="#f5ddd7" 
      text-anchor="middle" 
      letter-spacing="0.22em"
      opacity="0.9"
    >ESTÉTICA AVANÇADA</text>
  </g>
</svg>
